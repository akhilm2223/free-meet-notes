name: Build Free Meet Notes for macOS

on:
  workflow_dispatch:

concurrency:
  group: macos-preview-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  build-macos:
    name: macOS Apple Silicon compatibility build
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Set up pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          pnpm --version

      - name: Set up Rust
        shell: bash
        run: |
          rustup toolchain install 1.96.0 --profile minimal --target aarch64-apple-darwin
          rustup default 1.96.0
          rustc --version
          cargo --version

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build local summary sidecar
        shell: bash
        run: |
          cargo build --release -p llama-helper --features metal
          mkdir -p frontend/src-tauri/binaries
          cp target/release/llama-helper frontend/src-tauri/binaries/llama-helper-aarch64-apple-darwin

      - name: Test macOS-native safety features
        shell: bash
        run: |
          cargo test --release --manifest-path frontend/src-tauri/Cargo.toml meeting_detection::tests --lib
          cargo test --release --manifest-path frontend/src-tauri/Cargo.toml study_alerts::tests --lib
          cargo test --release --manifest-path frontend/src-tauri/Cargo.toml external_url_tests --lib

      - name: Build app and DMG
        working-directory: frontend
        run: pnpm tauri build --target aarch64-apple-darwin --bundles app,dmg

      - name: Stage compatibility build
        id: artifact
        shell: bash
        run: |
          dmg="$(find target/aarch64-apple-darwin/release/bundle/dmg -name '*.dmg' -type f -print -quit)"
          app="$(find target/aarch64-apple-darwin/release/bundle/macos -name '*.app' -type d -print -quit)"
          test -n "$dmg"
          test -n "$app"

          mkdir -p dist
          output="dist/Free-Meet-Notes-macOS-Apple-Silicon.dmg"
          cp "$dmg" "$output"
          shasum -a 256 "$output" > "$output.sha256"

          codesign --verify --deep --strict "$app"
          file "$app/Contents/MacOS/free-meet-notes"
          if spctl --assess --type execute --verbose=4 "$app"; then
            echo "Unexpectedly passed Gatekeeper assessment without release credentials" >&2
            exit 1
          fi

          hash="$(shasum -a 256 "$output" | awk '{print $1}')"
          echo "sha256=$hash" >> "$GITHUB_OUTPUT"

      - name: Upload compatibility artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Free-Meet-Notes-macOS-Apple-Silicon-unsigned
          path: |
            dist/Free-Meet-Notes-macOS-Apple-Silicon.dmg
            dist/Free-Meet-Notes-macOS-Apple-Silicon.dmg.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Build summary
        shell: bash
        run: |
          {
            echo "## Free Meet Notes macOS compatibility build"
            echo
            echo "- Target: **Apple Silicon (aarch64)**"
            echo "- SHA-256: **${{ steps.artifact.outputs.sha256 }}**"
            echo "- Signing: **ad hoc only**"
            echo "- Notarization: **not configured**"
            echo "- Distribution: development testing only; do not advertise as a one-click public download"
          } >> "$GITHUB_STEP_SUMMARY"
