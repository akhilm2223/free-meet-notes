name: Build Free Meet Notes for Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-windows:
    name: Windows x64 installer
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up pnpm
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          pnpm --version

      - name: Set up Rust
        shell: pwsh
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0
          rustc --version
          cargo --version

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build local summary sidecar
        shell: pwsh
        run: |
          cargo build --release -p llama-helper
          New-Item -ItemType Directory -Force -Path "frontend/src-tauri/binaries" | Out-Null
          Copy-Item -LiteralPath "target/release/llama-helper.exe" -Destination "frontend/src-tauri/binaries/llama-helper-x86_64-pc-windows-msvc.exe"

      - name: Build NSIS installer
        working-directory: frontend
        run: pnpm tauri build --bundles nsis

      - name: Stage installer and checksum
        id: installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem -LiteralPath "target/release/bundle/nsis" -Filter "*.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "Tauri did not produce an NSIS installer"
          }

          New-Item -ItemType Directory -Force -Path "dist" | Out-Null
          $output = "dist/Free-Meet-Notes-Setup.exe"
          Copy-Item -LiteralPath $installer.FullName -Destination $output
          $hash = (Get-FileHash -LiteralPath $output -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Free-Meet-Notes-Setup.exe" | Set-Content -LiteralPath "dist/Free-Meet-Notes-Setup.exe.sha256" -Encoding ascii
          "sha256=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Free-Meet-Notes-Windows-x64
          path: |
            dist/Free-Meet-Notes-Setup.exe
            dist/Free-Meet-Notes-Setup.exe.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            "dist/Free-Meet-Notes-Setup.exe" `
            "dist/Free-Meet-Notes-Setup.exe.sha256" `
            --title "Free Meet Notes $env:GITHUB_REF_NAME" `
            --generate-notes `
            --prerelease

      - name: Build summary
        shell: pwsh
        run: |
          "## Free Meet Notes Windows build" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- Installer: `Free-Meet-Notes-Setup.exe`" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- SHA-256: `${{ steps.installer.outputs.sha256 }}`" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- Signing: not configured; do not advertise this artifact as a trusted public release yet" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
